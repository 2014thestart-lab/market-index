name: daily-collect

on:
  schedule:
    # Twice daily for redundancy. Scheduled runs can be delayed or dropped
    # entirely under platform load, and a missed day is UNRECOVERABLE here --
    # the source only ever exposes one finalised day. Both runs target the
    # same finalised day; writes are UPSERTs, so the second is a harmless
    # no-op when the first succeeded.
    # 01:20 UTC = 10:20 KST  |  13:20 UTC = 22:20 KST
    - cron: "20 1 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        run: python scripts/collect.py

      - name: Render
        run: python scripts/render.py

      - name: Commit
        run: |
          git config user.name  "market-index-bot"
          git config user.email "actions@github.com"
          git add data/market.db out/
          git diff --staged --quiet || \
            git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
